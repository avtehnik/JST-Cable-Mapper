<!doctype html>
<meta charset="utf-8">
<title>JST sprite renderer</title>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "three-mesh-bvh": "/node_modules/three-mesh-bvh/build/index.module.js",
  "three-bvh-csg": "/node_modules/three-bvh-csg/build/index.module.js"
} }
</script>
<body style="margin:0;background:#51677A">
<script src="/node_modules/occt-import-js/dist/occt-import-js.js"></script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { SPEC, plug, header, materials, smdParts } from './models.js';

const occt = await occtimportjs({ locateFile: f => '/node_modules/occt-import-js/dist/' + f });

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.82;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
renderer.localClippingEnabled = true;
const ABOVE_BOARD = [new THREE.Plane(new THREE.Vector3(0, 0, 1), 0)];
function bodyBox(g) { const b = new THREE.Box3(); g.updateMatrixWorld(true); g.traverse(o => { if (o.isMesh && !o.userData.pcb) b.expandByObject(o); }); return b; }
const envTex = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
document.body.appendChild(renderer.domElement);

function makeScene(lightDir, groundZ, withGround) {
  const scene = new THREE.Scene();
  scene.environment = envTex;
  scene.environmentIntensity = 0.3;
  const key = new THREE.DirectionalLight(0xfff6ea, 2.6);
  key.position.copy(lightDir).multiplyScalar(60);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.radius = 6; key.shadow.blurSamples = 16;
  key.shadow.bias = -0.0004;
  const c = key.shadow.camera; c.left = c.bottom = -40; c.right = c.top = 40; c.near = 1; c.far = 200;
  scene.add(key);
  scene.add(new THREE.HemisphereLight(0xeef3ff, 0x55606a, 0.35));
  if (withGround) {
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({ opacity: 0.42 }));
    ground.position.z = groundZ; ground.receiveShadow = true; scene.add(ground);
  }
  return scene;
}

// orthographic camera looking along `dir` with `up`; framed on `box` (+ extra margin in mm)
function frame(box, dir, up, ppm, m) {
  const cam = new THREE.OrthographicCamera();
  const target = box.getCenter(new THREE.Vector3());
  cam.up.copy(up);
  cam.position.copy(target).addScaledVector(dir, -100);
  cam.lookAt(target);
  cam.updateMatrixWorld();
  const inv = cam.matrixWorldInverse;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (let i = 0; i < 8; i++) {
    const v = new THREE.Vector3(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).applyMatrix4(inv);
    x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y);
  }
  x0 -= m[3]; x1 += m[1]; y1 += m[0]; y0 -= m[2];
  cam.left = x0; cam.right = x1; cam.top = y1; cam.bottom = y0; cam.near = 1; cam.far = 300;
  cam.updateProjectionMatrix();
  const w = Math.round((x1 - x0) * ppm), h = Math.round((y1 - y0) * ppm);
  const px = v => { const p = v.clone().project(cam); return [+(((p.x + 1) / 2) * w).toFixed(1), +(((1 - p.y) / 2) * h).toFixed(1)]; };
  return { cam, w, h, px };
}

const PPM_PLUG = { SH: 60, GH: 48, PB: 48, XH: 28 };
const PPM_HDR = { SH: 44, GH: 36, PB: 36, XH: 22 };
const PLUG_TILT = 0, H_ELEV = 0, V_TILT = 0;   // straight-on orthographic views

async function sheet(cells) {
  // pack cells into columns no taller than 8000 px (WebP is limited to 16383 px per side)
  const LIM = 8000; let x = 0, y = 0, colW = 0, W = 0, H = 0;
  for (const c of cells) {
    if (y + c.h > LIM && y > 0) { x += colW; y = 0; colW = 0; }
    c.x = x; c.y = y; y += c.h; colW = Math.max(colW, c.w); W = Math.max(W, x + colW); H = Math.max(H, y);
  }
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  for (const c of cells) { ctx.drawImage(c.img, c.x, c.y); delete c.img; }
  return { url: cv.toDataURL('image/webp', 0.9), W, H };
}
function grab(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(renderer.domElement, 0, 0); return c; }

// ---------- XH housing from the user's 5-pin STL, re-tiled for any pin count ----------
// STL axes: x = pin row (pins at 2.6 + 2.5*i), y = thickness (latch side at min y), z = 0 flange .. 7.5 mating face.
let xhStl = null;
function clipSlab(pos, a, b) {                     // keep the part of every triangle with a <= x <= b
  const out = [];
  const clip = (poly, keep, t) => {
    const r = [];
    for (let i = 0; i < poly.length; i++) {
      const P = poly[i], Q = poly[(i + 1) % poly.length], pi = keep(P), qi = keep(Q);
      if (pi) r.push(P);
      if (pi !== qi) { const k = (t - P[0]) / (Q[0] - P[0]); r.push([t, P[1] + k * (Q[1] - P[1]), P[2] + k * (Q[2] - P[2])]); }
    }
    return r;
  };
  for (let i = 0; i < pos.length; i += 9) {
    let poly = [[pos[i], pos[i + 1], pos[i + 2]], [pos[i + 3], pos[i + 4], pos[i + 5]], [pos[i + 6], pos[i + 7], pos[i + 8]]];
    poly = clip(poly, p => p[0] >= a - 1e-6, a); if (poly.length < 3) continue;
    poly = clip(poly, p => p[0] <= b + 1e-6, b); if (poly.length < 3) continue;
    for (let k = 1; k < poly.length - 1; k++) out.push(...poly[0], ...poly[k], ...poly[k + 1]);
  }
  return out;
}
async function xhFromStl(n) {
  if (!xhStl) xhStl = (await window.loadStl('XH-5.stl')).getAttribute('position').array;
  const p = 2.5, c0 = 3.85, c1 = 11.35;          // cut planes between pins 1|2 and 4|5
  const left = clipSlab(xhStl, -1, c0), mid = clipSlab(xhStl, 6.35, 8.85), right = clipSlab(xhStl, c1, 99);
  const parts = [[left, 0]];
  for (let k = 0; k < n - 2; k++) parts.push([mid, c0 - 6.35 + k * p]);
  parts.push([right, c0 + (n - 2) * p - c1]);
  const all = [];
  const xc = (0.2 + 15 - (5 - n) * p) / 2, yc = 8.15;   // centre of the re-tiled housing
  for (const [arr, dx] of parts)
    for (let i = 0; i < arr.length; i += 3) {
      const x = arr[i] + dx, y = arr[i + 1], z = arr[i + 2];
      all.push(7.5 - z, x - xc, yc - y);              // -> plug frame: x mating..rear, y row, z latch up
    }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(all, 3));
  geo.computeVertexNormals();
  const M = materials(SPEC.XH.color), g = new THREE.Group();
  const mesh = new THREE.Mesh(geo, M.nylon); mesh.castShadow = mesh.receiveShadow = true; g.add(mesh);
  const ys = Array.from({ length: n }, (_, i) => (i - (n - 1) / 2) * p);
  for (const y of ys) {                              // tinned contacts seen through the open slots
    const c = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.7, 0.3), M.tin); c.position.set(1.6, y, -1.5); g.add(c);
  }
  return { group: g, L: 7.5, T: 5.7, ys };
}

window.renderPlugs = async (type, face) => {
  const S = SPEC[type], cells = [];
  for (let n = 2; n <= (type === 'GH' || type === 'PB' ? 15 : 20); n++) {
    const m = (type === 'XH' && window.USE_XH_STL) ? await xhFromStl(n) : plug(type, n);
    if (face === 'down') m.group.rotation.x = Math.PI;
    m.group.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(m.group);
    const scene = makeScene(new THREE.Vector3(-0.15, 0.45, 1).normalize(), box.min.z, true);
    scene.add(m.group);
    const dir = new THREE.Vector3(0, Math.sin(PLUG_TILT), -Math.cos(PLUG_TILT));
    const f = frame(box, dir, new THREE.Vector3(0, 1, 0), PPM_PLUG[type], [0.4, 0.4, m.T * 0.55 + 0.6, 0.4]);
    renderer.setSize(f.w, f.h); renderer.render(scene, f.cam);
    const mw = m.group.matrixWorld;
    const rear = m.ys.map(y => f.px(new THREE.Vector3(m.L, y, 0).applyMatrix4(mw))).sort((a, b) => a[1] - b[1]);
    const mate = f.px(new THREE.Vector3(0, 0, 0).applyMatrix4(mw));
    cells.push({ n, w: f.w, h: f.h, rear, mate, img: grab(f.w, f.h) });
  }
  const s = await sheet(cells);
  return { ...s, ppm: PPM_PLUG[type], cells };
};

// KiCad file for a header, or null (then the parametric model is used)
const p2 = n => String(n).padStart(2, '0');
function kicadFile(type, n, mount) {
  const re = {
    SH: mount === 'H' ? `^JST_SH_SM${p2(n)}B-SRSS-TB_` : `^JST_SH_BM${p2(n)}B-SRSS-TB_`,
    GH: mount === 'H' ? `^JST_GH_SM${p2(n)}B-GHS-TB_` : `^JST_GH_BM${p2(n)}B-GHS-TBT_`,
    XH: mount === 'H' ? `^JST_XH_S${n}B-XH-A_` : `^JST_XH_B${n}B-XH-A_`,
    PB: mount === 'H' ? `PicoBlade_53261-${p2(n)}71_` : `PicoBlade_53398-${p2(n)}71_`,
  }[type];
  return (window.KICAD || []).find(f => new RegExp(re).test(f)) || null;
}
// side of the vertical header where the latch is, in KiCad coordinates (we turn it toward the viewer, -y)
const LATCH_Y = { SH: +1, GH: +1, XH: +1, PB: -1 };

// variant: 'SMD' | 'THT'. KiCad has SMD models for SH/GH/PicoBlade and THT models for XH.
const KICAD_VARIANT = { SH: 'SMD', GH: 'SMD', PB: 'SMD', XH: 'THT' };
window.renderHeaders = async (type, mount, variant) => {
  variant = variant || KICAD_VARIANT[type];
  const cells = [], ppm = PPM_HDR[type], S = SPEC[type];
  const smd = variant === 'SMD';
  for (let n = 2; n <= (type === 'GH' || type === 'PB' ? 15 : 20); n++) {
    // XH SMD reuses the THT body and gets SMD tabs; PicoBlade THT has no model -> parametric
    const file = (type === 'PB' && !smd) ? null : kicadFile(type, n, mount);
    let g, bb, pinsX, src;
    if (file) {
      g = await loadStep(file, S.color);
      if (mount === 'V' && LATCH_Y[type] > 0) g.rotation.z = Math.PI;
      g.updateMatrixWorld(true);
      bb = new THREE.Box3().setFromObject(g);
      const cx = (bb.min.x + bb.max.x) / 2;
      pinsX = Array.from({ length: n }, (_, i) => cx + (i - (n - 1) / 2) * S.pitch);
      src = 'kicad';
    } else {
      const m = header(type, n, mount, smd);
      g = m.group; g.updateMatrixWorld(true);
      bb = bodyBox(g);
      pinsX = m.xs; src = 'param';
    }
    const scene = makeScene(mount === 'H' ? new THREE.Vector3(-0.35, -0.8, 1).normalize() : new THREE.Vector3(-0.12, -0.18, 1).normalize(), 0, false);
    scene.add(g);
    if (src === 'kicad' && type === 'XH' && smd) {
      g.traverse(o => { if (o.isMesh) o.material = [].concat(o.material).map(m => { const c = m.clone(); c.clippingPlanes = ABOVE_BOARD; return c; }); });  // no THT legs below the board
      scene.add(smdParts(bb, pinsX, mount, S.pitch, S.color));
    }
    const M = materials(S.color);
    let f, top, bottom;
    if (mount === 'H') {
      const body = bb;
      const front = body.min.y, w = body.max.x - body.min.x + 5;
      const cx = (body.min.x + body.max.x) / 2;
      if (src === 'kicad') {
        const pcb = new THREE.Mesh(new THREE.BoxGeometry(w, 14, 1.6), M.mask); pcb.position.set(cx, front + 0.3 + 7, -0.8); pcb.receiveShadow = true; scene.add(pcb);
        const edge = new THREE.Mesh(new THREE.BoxGeometry(w, 0.02, 1.3), M.fr4); edge.position.set(cx, front + 0.29, -0.8); scene.add(edge);
      }
      const zTop = Math.max(0.5, body.max.z);
      const box = new THREE.Box3(new THREE.Vector3(cx - w / 2, front - 0.4, -1.6), new THREE.Vector3(cx + w / 2, front + 4, zTop + 0.3));
      f = frame(box, new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 1), ppm, [0.4, 0.2, 0.2, 0.2]);
      top = f.px(new THREE.Vector3(cx, front, zTop))[1]; bottom = f.h;
    } else {
      const cx = (bb.min.x + bb.max.x) / 2, cy = (bb.min.y + bb.max.y) / 2;
      const w = bb.max.x - bb.min.x + 4.4, d = bb.max.y - bb.min.y + 4.4;
      if (src === 'kicad') {
        const pcb = new THREE.Mesh(new THREE.BoxGeometry(w + 4, d + 6, 1.6), M.mask); pcb.position.set(cx, cy, -0.8); pcb.receiveShadow = false; scene.add(pcb);
      }
      const box = new THREE.Box3(new THREE.Vector3(cx - w / 2, cy - d / 2, 0), new THREE.Vector3(cx + w / 2, cy + d / 2, Math.max(1, bb.max.z)));
      f = frame(box, new THREE.Vector3(0, 0, -1), new THREE.Vector3(0, 1, 0), ppm, [0.3, 0.2, 0.3, 0.2]);
      top = f.px(new THREE.Vector3(cx, bb.max.y, bb.max.z))[1]; bottom = f.px(new THREE.Vector3(cx, bb.min.y, 0))[1];
    }
    renderer.setSize(f.w, f.h); renderer.render(scene, f.cam);
    cells.push({ n, w: f.w, h: f.h, src, pins: pinsX.map(x => f.px(new THREE.Vector3(x, 0, 0))[0]), top, bottom, img: grab(f.w, f.h) });
  }
  const s = await sheet(cells);
  return { ...s, ppm, cells };
};

// free-angle debug render: az/el in degrees
window.debug = async (kind, type, n, v, az, el, ppm = 60) => {
  const m = kind === 'stlxh' ? await xhFromStl(n) : kind === 'plug' ? plug(type, n) : header(type, n, v);
  if (kind !== 'hdr' && v === 'down') m.group.rotation.x = Math.PI;
  m.group.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(m.group);
  const scene = makeScene(new THREE.Vector3(-0.3, -0.5, 1).normalize(), box.min.z, kind === 'plug');
  scene.add(m.group);
  const a = az * Math.PI / 180, e = el * Math.PI / 180;
  const dir = new THREE.Vector3(-Math.sin(a) * Math.cos(e), Math.cos(a) * Math.cos(e), -Math.sin(e));
  const f = frame(box, dir, new THREE.Vector3(0, 0, 1), ppm, [1, 1, 1, 1]);
  renderer.setSize(f.w, f.h); renderer.render(scene, f.cam);
  return renderer.domElement.toDataURL('image/png');
};
// ---------- STEP models (KiCad library) ----------
const stepCache = new Map();
async function loadStep(file, color) {
  const buf = new Uint8Array(await (await fetch('/models/kicad/' + file)).arrayBuffer());
  const res = occt.ReadStepFile(buf, null);
  if (!res.success) throw new Error('STEP read failed: ' + file);
  const M = materials(color), g = new THREE.Group();
  for (const m of res.meshes) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(m.attributes.position.array, 3));
    if (m.attributes.normal) geo.setAttribute('normal', new THREE.Float32BufferAttribute(m.attributes.normal.array, 3));
    geo.setIndex(new THREE.Uint32BufferAttribute(m.index.array, 1));
    if (!m.attributes.normal) geo.computeVertexNormals();
    const pick = c => {
      const [r, gg, b] = c || [0.9, 0.9, 0.9], mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
      if (mx - mn > 0.25 && r > b) return 0;                    // yellowish -> gold plating
      if (mx < 0.85 && mx - mn < 0.12) return 1;                // grey -> tin
      return 2;                                                 // light -> housing
    };
    const mats = [M.gold, M.tin, M.nylon];
    if (m.brep_faces && m.brep_faces.length) {
      for (const f of m.brep_faces) geo.addGroup(f.first * 3, (f.last - f.first + 1) * 3, pick(f.color || m.color));
    } else geo.addGroup(0, m.index.array.length, pick(m.color));
    const mesh = new THREE.Mesh(geo, mats); mesh.castShadow = mesh.receiveShadow = true;
    mesh.userData.color = [...new Set((m.brep_faces || []).map(f => (f.color || []).map(v => v.toFixed(2)).join('/')))].slice(0, 5);
    g.add(mesh);
  }
  return g;
}
window.loadStl = async (file) => {
  const geo = new STLLoader().parse(await (await fetch('/models/stl/' + file)).arrayBuffer());
  geo.computeVertexNormals();
  return geo;
};
window.debugStep = async (file, az, el, ppm = 50) => {
  let g;
  if (file.endsWith('.stl')) { g = new THREE.Group(); const m = new THREE.Mesh(await window.loadStl(file), materials(0xF5F2EA).nylon); m.castShadow = m.receiveShadow = true; g.add(m); }
  else g = await loadStep(file, 0xEFE4C6);
  g.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(g);
  const scene = makeScene(new THREE.Vector3(-0.3, -0.5, 1).normalize(), box.min.z, true);
  scene.add(g);
  scene.add(new THREE.AxesHelper(4));
  const a = az * Math.PI / 180, e = el * Math.PI / 180;
  const dir = new THREE.Vector3(-Math.sin(a) * Math.cos(e), Math.cos(a) * Math.cos(e), -Math.sin(e));
  const f = frame(box, dir, new THREE.Vector3(0, 0, 1), ppm, [2, 2, 2, 2]);
  renderer.setSize(f.w, f.h); renderer.render(scene, f.cam);
  return { url: renderer.domElement.toDataURL('image/png'), box: [box.min.toArray().map(v=>+v.toFixed(2)), box.max.toArray().map(v=>+v.toFixed(2))],
           colors: g.children.map(m => String(m.userData.color)) };
};
window.ready = true;
</script>
</body>
