<title>JST Cable Mapper</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF2F0; --panel:#FFFFFF; --panel-2:#F6F8F7; --ink:#15201B; --muted:#5A6962; --line:#D3DCD7;
  --accent:#1D5BBF; --accent-soft:#E3ECFA;
  --ok:#1C7F47; --ok-soft:#DDF1E5; --warn:#A5680F; --warn-soft:#FBEFD9;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1412; --panel:#161F1B; --panel-2:#1B2621; --ink:#E4ECE8; --muted:#94A69D; --line:#2A3832;
    --accent:#77A6F2; --accent-soft:#1B2A42;
    --ok:#5FCB8C; --ok-soft:#15301F; --warn:#E6AB4E; --warn-soft:#352812;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1412; --panel:#161F1B; --panel-2:#1B2621; --ink:#E4ECE8; --muted:#94A69D; --line:#2A3832;
  --accent:#77A6F2; --accent-soft:#1B2A42;
  --ok:#5FCB8C; --ok-soft:#15301F; --warn:#E6AB4E; --warn-soft:#352812;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:13px/1.45 var(--sans);padding-inline:16px;padding-block:12px 16px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
button{font:500 12px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.lbl{font:600 10px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
select,input[type=text],input[type=number]{font:13px var(--sans);color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;min-width:0}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}

/* top bar: title + shared series / pin-out */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;padding:10px 12px}
h1{font:700 20px/1 var(--cond);letter-spacing:.01em;margin:0 6px 4px 0;white-space:nowrap}
.top .f-type{width:190px}
.stepper{display:flex;gap:3px;width:118px}
.stepper input{text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stepper button{padding:4px 9px;flex:none}
.top .f-sig{flex:1;min-width:220px}
#sig{font-family:var(--mono)}

.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel-2)}
.seg label{flex:1;text-align:center;padding:4px 6px;font-size:12px;cursor:pointer;border-left:1px solid var(--line);user-select:none;white-space:nowrap}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:#fff}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.hint{font-size:11px;color:var(--muted);margin:0;line-height:1.3}

/* connector cards */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,44%);gap:8px 12px;align-items:start}
.side-h{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;min-width:0}
.tag{font:700 13px var(--cond);width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:#1F5E46;color:#F1F1E6;flex:none;align-self:center}
.side-h h2{font:600 14px/1.2 var(--cond);margin:0;white-space:nowrap}
.part{font:11px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .part b{font-weight:500;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preview{background:#E4E8E6;border-radius:8px;overflow:hidden;padding:4px 6px;align-self:stretch;display:grid;place-items:center}
.noneopt{display:none}
.side.none .noneopt{display:grid}
.side.none .opt{display:none}
.side.none{grid-template-columns:1fr}
.preview svg{display:block;width:100%;height:auto;max-height:150px}
@media (max-width:900px){.pair{grid-template-columns:1fr}}
@media (max-width:480px){.side{grid-template-columns:1fr}}

/* result */
.verdict{padding:12px;display:grid;grid-template-columns:minmax(300px,1fr) 1.9fr;gap:14px;align-items:start}
@media (max-width:900px){.verdict{grid-template-columns:1fr}}
.pill{align-self:flex-start;font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.verdict h3{font:700 19px/1.15 var(--cond);margin:0;text-wrap:balance}
.verdict ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.photo{background:#51677A;border-radius:8px;overflow:hidden;position:relative}
.copy-img{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#15201B;border-color:transparent;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.copy-img:hover{background:#fff}
.shot{position:fixed;inset:0;background:rgba(10,16,20,.72);display:grid;place-items:center;padding:16px;z-index:10}
.shot figure{margin:0;background:var(--panel);border-radius:10px;padding:12px;max-width:min(1100px,100%);display:flex;flex-direction:column;gap:8px}
.shot img{max-width:100%;max-height:70vh;border-radius:6px;display:block}
.shot figcaption{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.photo svg{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 430px))}
.search{display:flex;flex-direction:column;gap:4px}
/* view mode: opened from a BOM link — only the finished cable and the table */
.view-sum,.viewbar{display:none}
body.view .top, body.view .pair, body.view .search, body.view #pill, body.view #pillNote, body.view #autoCol, body.view .pinmap .awg{display:none}
body.view .view-sum{display:block;font:600 15px/1.3 var(--cond)}
body.view .view-sum small{display:block;font:400 12px var(--sans);color:var(--muted)}
body.view .viewbar{display:flex;justify-content:center}
body.view .viewbar button{color:var(--muted)}
body.view .photo svg{max-height:calc(100vh - 110px)}
.pinmap{display:flex;flex-direction:column;gap:4px;min-height:0}
.pinmap-h{display:flex;align-items:center;gap:8px;white-space:nowrap}
.pinmap .tbl{overflow:auto;max-height:max(160px,calc(100vh - 590px));border:1px solid var(--line);border-radius:6px}
.pinmap table{border-collapse:collapse;width:100%;font-size:12px}
.pinmap th,.pinmap td{padding:3px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.pinmap th{font:600 10px var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--panel-2);position:sticky;top:0}
.pinmap td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:center}
.pinmap td.sig{font-family:var(--mono)}
.pinmap th .ty{font:400 10px var(--mono);text-transform:none;letter-spacing:0;color:var(--muted)}
.pinmap tr:last-child td{border-bottom:0}
.awg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-left:auto}
.awg select{width:auto;padding:2px 6px;font-size:12px}
.csel{width:auto;padding:1px 4px;font-size:12px;background:transparent;border-color:transparent}
.csel:hover{border-color:var(--line)}
.sw{display:inline-block;width:18px;height:8px;border-radius:4px;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.q{display:flex;gap:6px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 3px 3px 8px}
.q code{font:11.5px var(--mono);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:all}
.q button{padding:3px 8px;flex:none}
</style>

<div class="wrap">
  <section class="card top">
    <h1>JST Cable Mapper</h1>
    <div class="field f-type"><label class="lbl" for="type">Тип</label><select id="type"></select></div>
    <div class="field"><label class="lbl" for="n">Пінів</label>
      <div class="stepper"><button type="button" data-step="-1" aria-label="Менше пінів">−</button>
      <input type="number" id="n"><button type="button" data-step="1" aria-label="Більше пінів">+</button></div></div>
    <div class="field f-sig"><label class="lbl" for="sig">Сигнали по порядку, через кому (однакові на обох кінцях)</label>
      <input type="text" id="sig" spellcheck="false" autocomplete="off"></div>
    <div class="field"><span class="lbl">Скручені</span>
      <div class="seg" role="radiogroup" style="width:110px">
        <label><input type="radio" name="twist" value="1">Так</label>
        <label><input type="radio" name="twist" value="0">Ні</label></div></div>
  </section>

  <div class="pair">
    <section class="card side" id="sideA"></section>
    <section class="card side" id="sideB"></section>
  </div>

  <section class="card verdict">
    <div class="col">
      <span class="pill" id="pill"></span>
      <p class="hint" id="pillNote" style="font-size:12px"></p>
      <div class="search"><span class="lbl">Шукати на AliExpress</span><div id="queries" class="search"></div></div>
      <div class="view-sum" id="viewSum"></div>
      <div class="pinmap">
        <div class="pinmap-h"><span class="lbl">Pinout for order</span><label class="awg"><select id="awg" aria-label="Переріз проводу для всіх проводів"></select></label><button type="button" id="autoCol" title="Повернути автоматичні кольори за назвами сигналів">↺</button><button type="button" id="copyMap" title="Копіювати таблицю текстом">Копіювати</button></div>
        <div class="tbl" id="pinmap"></div>
        <p class="hint" id="pinHint">Side A pins follow the signal list order (first signal = pin 1).</p>
      </div>
    </div>
    <div class="photo"><div id="photo"></div><button type="button" class="copy-img" id="copyImg">Копіювати зображення</button></div>
  </section>
  <div class="viewbar"><button type="button" id="editBtn">Показати налаштування</button></div>
</div>

<script>
const p2 = n => String(n).padStart(2,'0');
/* dimensions in mm: w0 = housing width minus (n-1)*pitch, len = housing length along the wire, od = wire outer diameter, hh = header height */
const TYPES = {
  SH:{label:'JST SH 1.0', q:'SH1.0', pitch:1.0, min:2, max:20, w0:3.0, len:4.3, od:0.85, hh:2.9, color:'#F2EFE6',
      housing:n=>`SHR-${p2(n)}V-S-B`, variants:['SMD'],
      parts:{SMD:{V:n=>`BM${p2(n)}B-SRSS-TB`, H:n=>`SM${p2(n)}B-SRSS-TB`}}},
  PB:{label:'JST 1.25 (PicoBlade)', q:'1.25mm', pitch:1.25, min:2, max:15, w0:3.2, len:6.0, od:0.9, hh:3.4, color:'#F1EEE4',
      housing:n=>`51021-${p2(n)}00`, variants:['SMD','THT'],
      parts:{SMD:{V:n=>`Molex 53398-${p2(n)}71`, H:n=>`Molex 53261-${p2(n)}71`}, THT:{V:n=>`Molex 53047-${p2(n)}10`, H:n=>`Molex 53048-${p2(n)}10`}}},
  GH:{label:'JST GH 1.25', q:'GH1.25', pitch:1.25, min:2, max:15, w0:3.25, len:5.2, od:1.0, hh:4.25, color:'#EDE2C4',
      housing:n=>`GHR-${p2(n)}V-S`, variants:['SMD'],
      parts:{SMD:{V:n=>`BM${p2(n)}B-GHS-TBT`, H:n=>`SM${p2(n)}B-GHS-TB`}}},
  XH:{label:'JST XH 2.54', q:'XH2.54', pitch:2.5, min:2, max:20, w0:4.9, len:9.8, od:1.4, hh:7.0, color:'#F3F0E8',
      housing:n=>`XHP-${n}`, variants:['THT','SMD'],
      parts:{THT:{V:n=>`B${n}B-XH-A`, H:n=>`S${n}B-XH-A`}, SMD:{V:n=>`B${n}B-XH-SM4-TB`, H:n=>`S${n}B-XH-SM4-TB · BX-XH2.54-${n}PWT`}}},
};
const DEFAULT = {type:'SH', n:4, names:['GND','3V3','SDA','SCL'], wires:'black',
  A:{mount:'H', dir:'L', variant:'SMD', part:''}, B:{mount:'V', dir:'L', variant:'SMD', part:''}};
const KEY = 'jst-cable-mapper-v3';
let state;
try{ state = JSON.parse(localStorage.getItem(KEY)) }catch(e){}
if(!state || !state.A || !TYPES[state.type]) state = structuredClone(DEFAULT);
// the mounting variant must exist for the selected series
/* ---------- the whole cable in one URL token (for BOM links) ----------
   The published page only receives a bare #anchor (letters, digits, - _ . ~), so the configuration is
   JSON -> UTF-8 -> base64url with a version prefix: #c1.<token> */
const ARTIFACT_URL = 'https://claude.ai/artifact/6VgHgJP9uww4VWeSAHMVD8';
// Where the page is self-hosted (GitHub Pages, company server…), links use ?cable=…; set this to that address,
// e.g. 'https://example.github.io/jst-cable/'. On claude.ai only a bare #anchor reaches the page.
const PUBLIC_URL = 'https://avtehnik.github.io/JST-Cable-Mapper/';
const onArtifact = () => !(PUBLIC_URL || location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname));
// token from ?cable=… / #… (older links)
const linkToken = () => new URLSearchParams(location.search).get('cable') || decodeURIComponent(location.hash.slice(1));
/* readable query: ?t=GH&p=5V,TX,RX,GND&c=red,blue,yellow,black&w=28&a=H-L-SMD&b=V-R-SMD
   t type · p signals (pin count = number of signals) · c colours · w AWG · a/b mount-direction-variant */
const COLOR_BY_EN = () => Object.fromEntries(Object.entries(COLOR_EN).map(([hex, en]) => [en, hex]));
function queryString(){
  const q = (k, v) => `${k}=${encodeURIComponent(v).replace(/%2C/g, ',')}`;
  const side = (x, k) => x.none ? `none-${stripLen(k)}-${tinned(k) ? 't' : 'n'}` : [x.mount, x.dir, x.variant].join('-');
  return [q('t', state.type), q('p', Array.from({length:state.n}, (_,i) => state.names[i]||'').join(',')),
          q('c', Array.from({length:state.n}, (_,i) => COLOR_EN[pinColor(i)]).join(',')),
          q('w', awgOf()), q('a', side(state.A, 'A')), q('b', side(state.B, 'B')), ...(state.twist ? ['tw=1'] : [])].join('&');
}
function decodeQuery(search){
  const u = new URLSearchParams(search), t = (u.get('t')||'').toUpperCase();
  if(!TYPES[t] || !u.has('p')) return null;
  const names = u.get('p').split(',').map(x => x.trim());
  if(names.length < 2) return null;
  const byEn = COLOR_BY_EN();
  const side = (v, d) => { if(!v) return d; if(/^none/i.test(v)){ const [, mm, tn] = v.split('-'); return { ...d, none: true, strip: parseFloat(mm) > 0 ? Math.min(20, parseFloat(mm)) : 2, tin: (tn||'t').toLowerCase() !== 'n' }; } const [m, dir, vr] = v.split('-');
    return { mount: (m||'').toUpperCase()==='V'?'V':'H', dir: (dir||'').toUpperCase()==='R'?'R':'L', variant: (vr||'').toUpperCase(), part:'' }; };
  return { type:t, n:names.length, names, wires:'color', awg:+u.get('w')||undefined, twist: u.get('tw') === '1',
           colors:(u.get('c')||'').split(',').map(x => byEn[x.trim().toLowerCase()]),
           A: side(u.get('a'), DEFAULT.A), B: side(u.get('b'), DEFAULT.B) };
}
const fromUrl = () => decodeQuery(location.search) || decodeCable(linkToken());
const b64u = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u = str => Uint8Array.from(atob(str.replace(/-/g,'+').replace(/_/g,'/')), ch => ch.charCodeAt(0));
function encodeCable(){
  const side = x => [x.mount, x.dir, x.variant];
  const o = { t: state.type, n: state.n, s: Array.from({length:state.n}, (_,i) => state.names[i]||''),
              c: Array.from({length:state.n}, (_,i) => COLORS.indexOf(pinColor(i))), w: awgOf(), a: side(state.A), b: side(state.B) };
  return 'c1.' + b64u(new TextEncoder().encode(JSON.stringify(o)));
}
function decodeCable(token){
  try{
    if(!/^c1\.[A-Za-z0-9_-]+$/.test(token)) return null;
    const o = JSON.parse(new TextDecoder().decode(unb64u(token.slice(3))));
    if(!TYPES[o.t] || !(o.n >= 2) || !Array.isArray(o.s)) return null;
    const side = (x, d) => Array.isArray(x) ? { mount: x[0]==='V'?'V':'H', dir: x[1]==='R'?'R':'L', variant: String(x[2]||''), part:'' } : d;
    return { type:o.t, n:o.n|0, names:o.s.map(String), wires:'color', awg:+o.w||undefined,
             colors:(o.c||[]).map(k => COLORS[k] || undefined),
             A: side(o.a, DEFAULT.A), B: side(o.b, DEFAULT.B) };
  }catch(e){ return null; }
}

const fixVariant = s => { const v = TYPES[state.type].variants; if(!v.includes(state[s].variant)) state[s].variant = v[0]; };
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)) }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sig = i => (state.names[i]||'').trim() || `#${i+1}`;

/* ---------- part number parser ----------
   Understands JST / Molex originals and the common Chinese clone naming, e.g.
   BX-XH2.54-5PWT (XH, 5 pins, horizontal SMD), XH2.54-4A (vertical THT), XH2.54-4AW (right-angle THT),
   SH1.0-4PLT (vertical SMD), GH1.25-6PWT, MX1.25-4PWT, A1251WV-S-4P. */
function parsePart(raw){
  const s = String(raw||'').toUpperCase().replace(/\s+/g,'');
  if(!s) return null;
  let m;
  if(/^(SHR|GHR|XHP|ZHR|PHR)-|^51021-/.test(s)) return {error:"Це корпус на кабель, а не гніздо на платі."};
  // JST originals
  if((m = s.match(/(?:^|[^A-Z])([SB])M?(\d{1,2})B-XH-(A|SM4-TB)/)) || (m = s.match(/^([SB])(\d{1,2})B-XH-(A|SM4-TB)/)))
    return {type:'XH', n:+m[2], mount:m[1]==='S'?'H':'V', variant:m[3]==='A'?'THT':'SMD'};
  if((m = s.match(/(SM|BM)(\d{2})B-SRSS/))) return {type:'SH', n:+m[2], mount:m[1]==='SM'?'H':'V', variant:'SMD'};
  if((m = s.match(/(SM|BM)(\d{2})B-GHS/))) return {type:'GH', n:+m[2], mount:m[1]==='SM'?'H':'V', variant:'SMD'};
  // Molex PicoBlade
  if((m = s.match(/53(047|048|261|398)-?(\d{2})/)))
    return {type:'PB', n:+m[2], mount:(m[1]==='047'||m[1]==='398')?'V':'H', variant:(m[1]==='047'||m[1]==='048')?'THT':'SMD'};
  // Joint Tech style A1251WV-S-4P / A1251WR-S-4P
  if((m = s.match(/A1251W?([VR])-?S?-?(\d{1,2})P/))) return {type:'PB', n:+m[2], mount:m[1]==='V'?'V':'H', variant:'SMD'};
  // generic clones: series token, pin count, style suffix
  const series = [[/(^|[^A-Z])XH(2\.54|2\.5)?/, 'XH'], [/(^|[^A-Z])SH(1\.0|1)?(?![0-9])/, 'SH'], [/(^|[^A-Z])GH(1\.25)?/, 'GH'], [/(^|[^A-Z])(MX|PICOBLADE|JST)?1\.25(?!\d)/, 'PB']];
  for(const [re, type] of series){
    const sm = s.match(re); if(!sm) continue;
    const rest = s.slice(sm.index + sm[0].length);
    const pm = rest.match(/(\d{1,2})(P|PIN|A)?([A-Z]*)/);
    if(!pm) return {error:"Не бачу кількості пінів у партномері."};
    const n = +pm[1], suf = (pm[2]==='A' ? 'A' : '') + (pm[3]||'');
    let mount, variant;
    if(/WT|SMT-?W|RA-?SMD|WS/.test(suf)) { mount='H'; variant='SMD'; }        // 卧贴: lying SMD
    else if(/LT|SMT/.test(suf)) { mount='V'; variant='SMD'; }                  // 立贴: standing SMD
    else if(/AW|W|RA|R/.test(suf)) { mount='H'; variant='THT'; }               // 弯针: right-angle pins
    else { mount='V'; variant='THT'; }                                          // 直针: straight pins
    if(!TYPES[type].variants.includes(variant)) variant = TYPES[type].variants[0];
    return {type, n, mount, variant};
  }
  if(/(^|[^A-Z])(PH|ZH|EH|VH|PA|HY)\d/.test(s)) return {error:"Ця серія (PH/ZH/EH/VH…) поки не підтримується."};
  return {error:"Не впізнаю партномер. Приклад: BX-XH2.54-5PWT, SM04B-GHS-TB, B5B-XH-A."};
}
const descr = p => `${TYPES[p.type].label}, ${p.n} пін., ${p.mount==='V'?'вертикальний':'горизонтальний'} ${p.variant}`;

/* ---------- global controls ---------- */
const typeSel = document.getElementById('type');
typeSel.innerHTML = Object.entries(TYPES).map(([k,t])=>`<option value="${k}">${t.label}</option>`).join('');
typeSel.addEventListener('change', () => { state.type = typeSel.value; fixVariant('A'); fixVariant('B'); clampN(); rebuildPins(); update(); });
const nIn = document.getElementById('n');
nIn.addEventListener('change', () => { state.n = parseInt(nIn.value)||2; clampN(); rebuildPins(); update(); });
document.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => { state.n += +b.dataset.step; clampN(); rebuildPins(); update(); }));
// signals: one comma-separated field; the count follows the list while typing
const sigEl = document.getElementById('sig');
sigEl.addEventListener('input', () => {
  const parts = sigEl.value.split(/[,;\t\n]+/).map(x => x.trim());
  if(parts.length && parts[parts.length-1] === '') parts.pop();
  state.names = parts;
  if(parts.length >= 2) state.n = parts.length;
  clampN(); update();
});
sigEl.addEventListener('change', rebuildPins);
function clampN(){
  const t = TYPES[state.type];
  state.n = Math.max(t.min, Math.min(t.max, state.n|0));
  while(state.names.length < state.n) state.names.push('');
}
function rebuildPins(){
  if(document.activeElement === sigEl) return;           // don't fight the cursor while typing
  sigEl.value = Array.from({length:state.n}, (_,i) => state.names[i]||'').join(', ');
}

/* ---------- side cards ---------- */
function buildSide(s){
  const root = document.getElementById('side'+s);
  root.innerHTML = `
    <div class="side-h"><div class="tag">${s}</div><h2>${s==='A'?"Плата A":"Плата B"}</h2><span id="part${s}" class="part"></span></div>
    <div class="col">
      <div class="field"><span class="lbl">Кінець ${s}</span>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="none${s}" value="0">Роз'єм</label>
          <label><input type="radio" name="none${s}" value="1">Без роз'єму (дроти)</label></div></div>
      <div class="row2 noneopt">
        <div class="field"><label class="lbl" for="strip${s}">Зачистка, мм</label>
          <input type="number" id="strip${s}" min="0.5" max="20" step="0.5"></div>
        <div class="field"><span class="lbl">Лудіння</span>
          <div class="seg" role="radiogroup">
            <label><input type="radio" name="tin${s}" value="1">Так</label>
            <label><input type="radio" name="tin${s}" value="0">Ні</label></div></div>
      </div>
      <div class="col opt" style="gap:8px">
        <div class="field"><span class="lbl">Монтаж</span>
          <div class="seg" role="radiogroup">
            <label title="Вертикальний"><input type="radio" name="mount${s}" value="V">Верт.</label>
            <label title="Горизонтальний"><input type="radio" name="mount${s}" value="H">Гориз.</label></div></div>
        <div class="field" id="varF${s}"><span class="lbl">Виконання</span>
          <div class="seg" role="radiogroup" id="var${s}"></div></div>
      </div>
      <div class="field opt"><span class="lbl">Напрямок розпіновки</span>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="dir${s}" value="L"><span id="dirL${s}"></span></label>
          <label><input type="radio" name="dir${s}" value="R"><span id="dirR${s}"></span></label></div>
        <p class="hint" id="how${s}"></p></div>
    </div>
    <div class="preview opt" id="prev${s}"></div>`;
  root.querySelectorAll(`input[name=none${s}]`).forEach(r => r.addEventListener('change', () => { state[s].none = r.value==='1'; update(); }));
  const stIn = root.querySelector('#strip'+s);
  stIn.addEventListener('change', () => { const v = parseFloat(stIn.value); state[s].strip = v > 0 ? Math.min(20, v) : 2; update(); });
  root.querySelectorAll(`input[name=tin${s}]`).forEach(r => r.addEventListener('change', () => { state[s].tin = r.value==='1'; update(); }));
  root.querySelector('#var'+s).addEventListener('change', e => { if(e.target.name==='var'+s){ state[s].variant = e.target.value; update(); } });
  root.querySelectorAll(`input[name=mount${s}]`).forEach(r => r.addEventListener('change', () => { state[s].mount = r.value; update(); }));
  root.querySelectorAll(`input[name=dir${s}]`).forEach(r => r.addEventListener('change', () => { state[s].dir = r.value; update(); }));
}
function syncSide(s){
  const st = state[s], t = TYPES[state.type], first = esc(sig(0));
  document.querySelectorAll(`input[name=none${s}]`).forEach(r => r.checked = (r.value==='1') === !!st.none);
  document.getElementById('side'+s).classList.toggle('none', !!st.none);
  document.getElementById('strip'+s).value = stripLen(s);
  document.querySelectorAll(`input[name=tin${s}]`).forEach(r => r.checked = (r.value==='1') === tinned(s));
  if(st.none){ document.getElementById('part'+s).innerHTML = `без роз'єму, ${endUa(s)}`; return; }
  document.querySelectorAll(`input[name=mount${s}]`).forEach(r => r.checked = r.value===st.mount);
  document.querySelectorAll(`input[name=dir${s}]`).forEach(r => r.checked = r.value===st.dir);
  document.getElementById('dirL'+s).innerHTML = `${first} зліва`;
  document.getElementById('dirR'+s).innerHTML = `${first} справа`;
  document.getElementById('how'+s).textContent = st.mount==='H'
    ? "Дивлячись в отвір, плата знизу (як на картинці)."
    : "Дивлячись згори, замком до себе.";
  const vs = t.variants;
  document.getElementById('varF'+s).hidden = vs.length < 2;
  document.getElementById('var'+s).innerHTML = vs.map(v =>
    `<label title="${v==='SMD'?'поверхневий монтаж':'монтаж в отвори'}"><input type="radio" name="var${s}" value="${v}"${v===st.variant?' checked':''}>${v}</label>`).join('');
  document.getElementById('part'+s).innerHTML = `гніздо <b>${t.parts[st.variant][st.mount](state.n)}</b>`;
  document.getElementById('prev'+s).innerHTML = drawHeader(s);
}

// a side without a connector: strip length (mm) and tinning
const stripLen = s => (state[s].strip > 0 ? state[s].strip : 2);
const tinned = s => state[s].tin !== false;
const endText = s => `stripped ${stripLen(s)} mm${tinned(s) ? ', tinned' : ', not tinned'}`;
const endUa = s => `зачистка ${stripLen(s)} мм${tinned(s) ? ', луджені' : ', без лудіння'}`;

/* ---------- the physics ----------
   plugSide: where signal #1 is when you look straight at the plug's mating face with its latch up.
   Horizontal header seen from the front = looking the same way the plug points -> mirrored.
   Vertical header seen from above with the latch wall toward you -> not mirrored. */
// Horizontal headers are shown from the front with the board below. In most series the latch is on top there;
// in PicoBlade SMD (53261) it sits at the bottom, next to the board, which mirrors left/right once more.
const hLockTop = s => !(state.type === 'PB' && state[s].variant === 'SMD');
const plugSide = s => {
  const st = state[s];
  if(st.mount !== 'H') return st.dir;
  return hLockTop(s) ? (st.dir==='L'?'R':'L') : st.dir;
};
function analyse(){
  const pA = plugSide('A'), pB = plugSide('B');
  const same = pA !== pB;          // both latches on the same face when laid flat
  const topFirst = pA === 'L';     // left plug latch-up: signal #1 is on the top row when pA = L
  // B alone (A has no connector): right plug latch-up has signal #1 on the top row when pB = R
  return {same, topFirst, topFirstB: pB === 'R', noneA: !!state.A.none, noneB: !!state.B.none};
}

// colour per pin (signal index): user's choice, otherwise the palette by pin number
const C = {red:'#E2413A', black:'#1B1B1B', white:'#F1F1F1', yellow:'#F2C31B', blue:'#4D6BE6', green:'#1E9F78'};
// colour suggested by the signal name, or null
function ruleColor(name){
  const n = String(name||'').toUpperCase().replace(/\s+/g,'');
  const t = n.replace(/^(UART|USART|SERIAL|USB|I2C|IIC|TWI)\d*[_\-.]?/, '').replace(/\d+$/, '');   // UART1_TX -> TX, TX2 -> TX
  if(/^(GND|G|GROUND|VSS|0V|AGND|DGND|PGND|-|MINUS|BAT-|V-)$/.test(n)) return C.black;
  if(/^\+?\d+(\.\d+)?V\d*$/.test(n) || /^\d+V\d+$/.test(n) || /^\d+S$/.test(n) ||
     /^(VCC|VDD|VIN|VBAT|VBA|VBUS|VSYS|V\+|BAT\+|PWR|\+)$/.test(n)) return C.red;
  if(/^(D\+|DP|DATA\+|USB\+|USB_?DP|USB_?D\+)$/.test(n)) return C.white;
  if(/^(D-|DM|DN|DATA-|USB-|USB_?DM|USB_?D-)$/.test(n)) return C.green;
  if(/^(SCL|SCK|I2C_?SCL)$/.test(n) || t === 'SCL') return C.green;
  if(/^(SDA|I2C_?SDA)$/.test(n) || t === 'SDA') return C.white;
  if(t === 'TX' || t === 'TXD') return C.blue;
  if(t === 'RX' || t === 'RXD') return C.yellow;
  return null;
}
// automatic colours for all pins: rules first, then unused palette colours for the rest
function autoColors(){
  const n = state.n, out = Array.from({length:n}, (_,i) => ruleColor(state.names[i]));
  const used = new Set(out.filter(Boolean));
  const pool = ['#F2C31B','#1E9F78','#4D6BE6','#F1F1F1','#E8673C','#7A3FB0','#A5A5A5','#8C2D2D','#E2413A','#1B1B1B'];
  let k = 0;
  for(let i=0;i<n;i++){
    if(out[i]) continue;
    const free = pool.filter(c => !used.has(c));
    out[i] = free.length ? free[0] : pool[k++ % pool.length];
    used.add(out[i]);
  }
  return out;
}
const pinColor = i => (state.colors && COLORS.includes(state.colors[i]) && state.colors[i]) || autoColors()[i];   // ignores colours from an older palette
function drawCable(r){
  const n = state.n, type = state.type, hasA = !r.noneA, hasB = !r.noneB;
  // which rendered face of the housing points 'up' (away from the board / toward the latch wall) when mated.
  // SH and PicoBlade: the smooth face, not the one with open contacts.
  const flip = type === 'SH' || type === 'PB';
  // PicoBlade is drawn turned over along the cable axis: side A shows its contact face by default.
  // Turning the whole cable over swaps both visible faces and reverses the row order, the wiring stays the same.
  const turnOver = type === 'PB';
  const faceFlip = flip !== turnOver, up0 = faceFlip ? 'down' : 'up', other = x => x === 'up' ? 'down' : 'up';
  let faceA = up0, faceB = up0, topFirst = true;
  if(hasA){ faceB = r.same ? faceA : other(faceA); topFirst = r.topFirst !== turnOver; }
  else if(hasB){ topFirst = r.topFirstB !== turnOver; }
  const nA = `plug-${type}-${faceA}`, nB = `plug-${type}-${faceB}`;
  const cA = hasA ? cellOf(nA, n) : null, cB = hasB ? cellOf(nB, n) : null, ref = cA || cB || cellOf(`plug-${type}-up`, n);
  const ppm = SPR[`plug-${type}-up`].ppm, hMax = Math.max(ref.h, cA ? cA.h : 0, cB ? cB.h : 0);
  const f = Math.min(0.85, 330 / hMax);
  const W = 1000, H = hMax*f + 120, cy = 50 + hMax*f/2;
  const xA = 120, xB = W - 120;
  const mid = c => c.rear.reduce((a,p)=>a+p[1],0)/c.rear.length;
  const mm = ppm*f, ww = AWG_OD[awgOf()]*mm*0.75, tuck = 1.2*mm;   // wires drawn thinner than true OD so the housings read better
  const stripPx = side => Math.max(6, Math.min(80, stripLen(side) * mm));            // stripped ends, to scale
  const rowsOf = c => c.rear.map(p => cy - mid(c)*f + p[1]*f);
  const ys = rowsOf(cA || cB || ref);
  const rearA = cA ? cA.rear.map(p => [xA + (p[0]-cA.mate[0])*f, cy - mid(cA)*f + p[1]*f]) : ys.map(y => [xA + stripPx('A'), y]);
  const rearB = cB ? cB.rear.map(p => [xB - (p[0]-cB.mate[0])*f, cy - mid(cB)*f + p[1]*f]) : ys.map(y => [xB - stripPx('B'), y]);
  const rowSig = k => topFirst ? k : n-1-k;

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Кабель, покладений пласко" style="font-family:'IBM Plex Mono',monospace">
  <defs>
    <pattern id="mat" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#51677A"/><path d="M40 0H0V40" fill="none" stroke="#6A8195" stroke-width="1"/></pattern>
    <filter id="wsh" x="-5%" y="-30%" width="110%" height="160%"><feDropShadow dx="0" dy="${Math.max(2,mm*0.9)}" stdDeviation="${Math.max(1.5,mm*0.6)}" flood-color="#0B1620" flood-opacity=".45"/></filter>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#mat)"/>`;

  const x1 = rearA[0][0] - (cA ? tuck : 0), x2 = rearB[0][0] + (cB ? tuck : 0);
  const spacing = n>1 ? Math.abs(rearA[1][1]-rearA[0][1]) : 10, amp = Math.min(10, spacing*0.3);
  const wirePaths = (d, c, w) =>
    `<path d="${d}" fill="none" stroke="#0A0F14" stroke-opacity=".55" stroke-width="${w+1.2}" stroke-linejoin="round" stroke-linecap="round"/>` +
    `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>` +
    `<path d="${d}" fill="none" stroke="#FFFFFF" stroke-opacity="${c==='#F1F1F1'?.9:.25}" stroke-width="${Math.max(.8,w*.26)}" transform="translate(0 ${-w*.2})" stroke-linejoin="round" stroke-linecap="round"/>`;
  let wires = '';
  if(!state.twist){
    // a gentle common wave, like a real loose cable
    for(let k=0;k<n;k++){
      const ya = rearA[k][1], yb = rearB[k][1];
      let d = '';
      for(let j=0;j<=60;j++){
        const u = j/60, x = x1 + (x2-x1)*u, env = Math.sin(Math.PI*u);
        const y = ya + (yb-ya)*u + amp*env*Math.sin(2*Math.PI*u*1.15 + .6) + env*env*amp*0.6;
        d += (j?'L':'M') + x.toFixed(1) + ' ' + y.toFixed(1);
      }
      wires += wirePaths(d, pinColor(rowSig(k)), ww);
    }
  } else {
    // twisted: the wires gather into a bundle and wind around its axis; segments are painted back to front
    const R = ww * 0.55 * Math.sqrt(n), turns = Math.max(3, (x2 - x1) / (ww * 7 + 26)), steps = 220, segs = [];
    const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : t*t*(3-2*t);
    for(let k=0;k<n;k++){
      const ya = rearA[k][1], yb = rearB[k][1], ph = 2*Math.PI*k/n, pts = [];
      for(let j=0;j<=steps;j++){
        const u = j/steps, b = ease(u/0.16) * ease((1-u)/0.16), th = 2*Math.PI*turns*u + ph;
        pts.push([x1 + (x2-x1)*u, (1-b)*(ya + (yb-ya)*u) + b*(cy + R*Math.cos(th)), b*Math.sin(th)]);
      }
      for(let j=0;j<steps;j++) segs.push({ d:`M${pts[j][0].toFixed(1)} ${pts[j][1].toFixed(1)}L${pts[j+1][0].toFixed(1)} ${pts[j+1][1].toFixed(1)}`, z:(pts[j][2]+pts[j+1][2])/2, c:pinColor(rowSig(k)) });
    }
    segs.sort((p, q) => p.z - q.z);
    for(const g of segs) wires += wirePaths(g.d, g.c, ww * (1 + g.z * 0.08));
  }
  // stripped ends where a side has no connector
  const bare = (xa, xb, y, side) => {
    const cw = ww*0.55, seg = `M${xa} ${y}L${xb} ${y}`;
    return tinned(side)
      ? `<path d="${seg}" stroke="#7F868D" stroke-width="${cw+1}" stroke-linecap="round"/><path d="${seg}" stroke="#D9DDE1" stroke-width="${cw}" stroke-linecap="round"/><path d="${seg}" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="${Math.max(.6,cw*.25)}" transform="translate(0 ${-cw*.2})"/>`
      : `<path d="${seg}" stroke="#7A4A22" stroke-width="${cw+1}"/><path d="${seg}" stroke="#C98A4B" stroke-width="${cw}"/><path d="${seg}" stroke="#8A5427" stroke-width="${Math.max(.5,cw*.12)}" transform="translate(0 ${-cw*.22})"/><path d="${seg}" stroke="#8A5427" stroke-width="${Math.max(.5,cw*.12)}" transform="translate(0 ${cw*.22})"/>`;
  };
  for(let k=0;k<n;k++){
    if(!cA) wires += bare(xA, rearA[k][0], rearA[k][1], 'A');
    if(!cB) wires += bare(rearB[k][0], xB, rearB[k][1], 'B');
  }
  s += `<g filter="url(#wsh)">${wires}</g>`;
  if(cA) s += `<g transform="translate(${xA - cA.mate[0]*f} ${cy - mid(cA)*f}) scale(${f})">${spriteSvg(nA, cA)}</g>`;
  if(cB) s += `<g transform="translate(${xB + cB.mate[0]*f} ${cy - mid(cB)*f}) scale(${-f} ${f})">${spriteSvg(nB, cB)}</g>`;

  const fs = Math.max(9, Math.min(13, spacing*0.8));
  for(let k=0;k<n && !viewMode;k++){   // signal names beside the wires; hidden in view mode
    const i = rowSig(k), bold = i===0 ? ' font-weight="700" fill="#FFFFFF"' : ' fill="#D5E1EA"';
    s += `<text x="${xA-12}" y="${rearA[k][1] + fs*0.35}" font-size="${fs}" text-anchor="end"${bold}>${esc(sig(i))}</text>`;
    s += `<text x="${xB+12}" y="${rearB[k][1] + fs*0.35}" font-size="${fs}"${bold}>${esc(sig(i))}</text>`;
  }
  const cxA = cA ? xA + (cA.w/2 - cA.mate[0])*f*0.6 : xA, cxB = cB ? xB - (cB.w/2 - cB.mate[0])*f*0.6 : xB;
  const cap = (x, up, name) =>
    `<text x="${x}" y="28" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">${name}</text>
     <text x="${x}" y="${H-20}" font-size="13" fill="${up?'#FFE08A':'#9FD3FF'}" text-anchor="middle">${up?FACE(type).up:FACE(type).down}</text>`;
  const endCap = (x, side) =>
    `<text x="${x}" y="28" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">кінець ${side}</text>
     <text x="${x}" y="${H-20}" font-size="13" fill="#C3D2DD" text-anchor="middle">${endUa(side)}</text>`;
  s += cA ? cap(cxA, faceA === 'up', 'до плати A') : endCap(cxA, 'A');
  s += cB ? cap(cxB, faceB === 'up', 'до плати B') : endCap(cxB, 'B');
  s += `<text x="${W/2}" y="${H-20}" font-size="12" fill="#C3D2DD" text-anchor="middle">вид згори · ${state.twist ? 'скручені дроти' : 'кабель лежить пласко'}</text>`;
  return s + '</svg>';
}

/* what marks the 'up' face of the housing on seller photos */
const FACE = t => (t==='SH' || t==='PB')
  ? {up:'▲ контакти видно', down:'▼ гладким боком', same:"обидва роз'єми лежать відкритими контактами догори", diff:"один роз'єм лежить відкритими контактами догори, другий — гладким боком", word:'бік з відкритими контактами'}
  : {up:'▲ замок догори', down:'▼ замок донизу', same:"обидва роз'єми лежать замком догори", diff:"один роз'єм лежить замком догори, другий — замком донизу", word:'замок'};

/* ---------- verdict ---------- */
function verdict(r){
  const t = TYPES[state.type], n = state.n;
  const n0 = state.n;
  const only = r.noneA && r.noneB ? 'none' : r.noneB ? 'A' : r.noneA ? 'B' : '';
  document.getElementById('pill').textContent = only === 'none' ? "Без роз'ємів · дроти" : only === 'A' ? 'Односторонній · A → дроти' : only === 'B' ? 'Односторонній · дроти → B' : r.same ? `Дзеркальний · 1 → ${n0}` : 'Прямий · 1 → 1';
  document.getElementById('pillNote').textContent =
      only === 'none' ? `Обидва кінці — зачищені проводи. A: ${endUa('A')}; B: ${endUa('B')}.`
    : only === 'A' ? `Роз'єм тільки з боку A, з іншого боку — зачищені кінці проводів (${endUa('B')}).`
    : only === 'B' ? `Роз'єм тільки з боку B, з іншого боку — зачищені кінці проводів (${endUa('A')}).`
    : r.same
    ? `Контакт 1 одного роз'єму йде на контакт ${n0} іншого. На фото продавця обидва роз'єми лежать однаковим боком («same direction», 同向).`
    : `Контакт 1 йде на контакт 1, сигнали без перехрещень. На фото продавця роз'єми лежать різними боками («reverse direction», 反向).`;
  document.getElementById('photo').innerHTML = drawCable(r);
  const a = state.A, b = state.B;
  const en = r.same ? 'same direction' : 'reverse direction';
  const tw = state.twist ? ' twisted' : '';
  const qs = only === 'none' ? [`${awgOf()}AWG ${n} core${tw} wire`, `${awgOf()}AWG ${n}芯${state.twist ? ' 双绞' : ''} 电子线`]
           : only ? [`JST ${t.q} ${n}P single head cable${tw}`, `${t.q} ${n}P 单头${state.twist ? ' 双绞' : ''}`]
                     : [`JST ${t.q} ${n}P double head cable ${en}${tw}`, `${t.q} ${n}P 双头 ${r.same?'同向':'反向'}${state.twist ? ' 双绞' : ''}`];
  document.getElementById('queries').innerHTML = qs.map((q,i)=>
    `<div class="q"><code>${esc(q)}</code><button type="button" data-q="${i}">Копіювати</button></div>`).join('');
  document.querySelectorAll('[data-q]').forEach(btn => btn.addEventListener('click', async () => {
    try{ await navigator.clipboard.writeText(qs[+btn.dataset.q]); btn.textContent = 'Скопійовано'; }
    catch(e){ btn.textContent = 'Виділіть текст'; }
    setTimeout(() => btn.textContent = 'Копіювати', 1500);
  }));
}

/* ---------- order table: housing A pin -> housing B pin ---------- */
document.getElementById('pinmap').addEventListener('change', e => {
  if(!e.target.classList.contains('csel')) return;
  state.colors = state.colors || [];
  state.colors[+e.target.dataset.i] = e.target.value;
  update();
});
document.getElementById('autoCol').addEventListener('click', () => { state.colors = []; update(); });
const awgSel = document.getElementById('awg');
awgSel.addEventListener('change', () => { state.awg = +awgSel.value; update(); });
const COLOR_NAMES = {'#E2413A':'червоний','#1B1B1B':'чорний','#F1F1F1':'білий','#F2C31B':'жовтий','#4D6BE6':'синій','#1E9F78':'зелений','#A5A5A5':'сірий','#8C2D2D':'коричневий','#E8673C':'помаранчевий','#7A3FB0':'фіолетовий'};
function pinRows(r){
  const n = state.n;
  return Array.from({length:n}, (_,i) => ({ a: i+1, b: r.same ? n - i : i + 1, sig: sig(i), color: pinColor(i) }));
}
const COLOR_EN = {'#E2413A':'red','#1B1B1B':'black','#F1F1F1':'white','#F2C31B':'yellow','#4D6BE6':'blue','#1E9F78':'green','#A5A5A5':'gray','#8C2D2D':'brown','#E8673C':'orange','#7A3FB0':'purple'};
// connector type shown for each side, e.g. "JST GH 1.25"
const sideType = () => TYPES[state.type].label;
let viewMode = false;
function drawPinmap(r){
  document.getElementById('pinHint').textContent = r.noneA && r.noneB ? 'Wires follow the signal list order.' : `Side ${r.noneA ? 'B' : 'A'} pins follow the signal list order (first signal = pin 1).`;
  const kindUa = r.noneA && r.noneB ? `Без роз'ємів: A — ${endUa('A')}, B — ${endUa('B')}`
    : r.noneB ? `Односторонній кабель: роз'єм A, з іншого боку ${endUa('B')}`
    : r.noneA ? `Односторонній кабель: роз'єм B, з іншого боку ${endUa('A')}`
    : r.same ? `Дзеркальний кабель, контакт 1 → ${state.n}` : 'Прямий кабель, контакт 1 → 1';
  document.getElementById('viewSum').innerHTML = `${esc(TYPES[state.type].label)} · ${state.n}P · ${awgOf()} AWG${state.twist ? ' · скручені' : ''}<small>${kindUa}</small>`;
  const rows = pinRows(r), ty = esc(sideType());
  awgSel.innerHTML = AWG_RANGE[state.type].map(a => `<option value="${a}"${a===awgOf()?' selected':''}>${a} AWG</option>`).join('');
  document.getElementById('pinmap').innerHTML = `<table><thead><tr>${viewMode ? '' : '<th>Signal</th>'}<th>Color</th><th>Side A${r.noneA ? '<div class="ty">no connector</div>' : ` pin<div class="ty">${ty}</div>`}</th><th>Side B${r.noneB ? '<div class="ty">no connector</div>' : ` pin<div class="ty">${ty}</div>`}</th></tr></thead><tbody>${
    rows.map(x => `<tr>${viewMode ? '' : `<td class="sig">${esc(x.sig)}</td>`}<td><span class="sw" style="background:${x.color}"></span> ${viewMode ? COLOR_EN[x.color] : `<select class="csel" data-i="${x.a-1}" aria-label="Wire color for pin ${x.a}">${COLORS.map(c => `<option value="${c}"${c===x.color?' selected':''}>${COLOR_EN[c]}</option>`).join('')}</select>`}</td><td class="n">${r.noneA ? endText('A') : x.a}</td><td class="n">${r.noneB ? endText('B') : r.noneA ? x.a : x.b}</td></tr>`).join('')
  }</tbody></table>`;
}
document.getElementById('copyMap').addEventListener('click', async e => {
  const btn = e.currentTarget, r = analyse(), t = TYPES[state.type];
  const kind = r.noneA && r.noneB ? `wire set, no connectors (side A: ${endText('A')}; side B: ${endText('B')})`
    : r.noneB ? `single-ended cable (side B: ${endText('B')})`
    : r.noneA ? `single-ended cable (side A: ${endText('A')})`
    : `double-ended cable, ${r.same ? `mirrored (pin 1 to pin ${state.n})` : 'straight (pin 1 to pin 1)'}`;
  const txt = [`${t.label} ${state.n}P ${kind}, wire ${awgOf()} AWG${state.twist ? ', twisted' : ''}`,
               [...(viewMode ? [] : ['Signal']),'Color', r.noneA ? 'Side A' : `Side A pin (${sideType()})`, r.noneB ? 'Side B' : `Side B pin (${sideType()})`].join('\t'),
               ...pinRows(r).map(x => [...(viewMode ? [] : [x.sig]), COLOR_EN[x.color]||'', r.noneA ? endText('A') : x.a, r.noneB ? endText('B') : r.noneA ? x.a : x.b].join('\t'))].join('\n');
  try{ await navigator.clipboard.writeText(txt); btn.textContent = 'Скопійовано'; }

/* ---------- copy the cable picture as PNG ---------- */
const dataUrlCache = new Map();
async function toDataUrl(url){
  if(!dataUrlCache.has(url)) dataUrlCache.set(url, fetch(url).then(r => r.blob()).then(b => new Promise(res => {
    const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); })));
  return dataUrlCache.get(url);
}
async function photoPng(scale = 2){
  const src = document.querySelector('#photo svg'), svg = src.cloneNode(true);
  // sprites must be embedded, an SVG drawn as an image cannot fetch them
  for(const im of svg.querySelectorAll('image')) im.setAttribute('href', await toDataUrl(im.getAttribute('href')));
  const [, , w, h] = svg.getAttribute('viewBox').split(/\s+/).map(Number);
  svg.setAttribute('width', w * scale); svg.setAttribute('height', h * scale);
  svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
  await img.decode();
  const c = document.createElement('canvas'); c.width = w * scale; c.height = h * scale;
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/png'));
}
function showShot(blob){
  const url = URL.createObjectURL(blob), el = document.createElement('div');
  el.className = 'shot';
  el.innerHTML = `<figure><img src="${url}" alt="Зображення кабелю"><figcaption><span>Браузер не дав скопіювати автоматично. Клацніть по картинці правою кнопкою → «Копіювати зображення».</span><button type="button">Закрити</button></figcaption></figure>`;
  const close = () => { el.remove(); URL.revokeObjectURL(url); };
  el.addEventListener('click', e => { if(e.target === el || e.target.tagName === 'BUTTON') close(); });
  document.body.appendChild(el);
}
document.getElementById('copyImg').addEventListener('click', async e => {
  const btn = e.currentTarget, png = photoPng();
  const done = t => { btn.textContent = t; setTimeout(() => btn.textContent = 'Копіювати зображення', 1600); };
  try{
    // the promise form keeps the click's user activation (needed by Safari)
    await navigator.clipboard.write([new ClipboardItem({'image/png': png})]);
    done('Скопійовано');
  }catch(err){
    try{ showShot(await png); }catch(e2){ done('Не вдалося'); }
  }
});

function cableLink(){
  const t = encodeCable();
  if(onArtifact()) return ARTIFACT_URL + '#' + t;
  const base = PUBLIC_URL || location.origin + location.pathname;
  return base + '?' + queryString();
}
window.addEventListener('hashchange', () => {
  const o = fromUrl();
  if(o){ state = o; clampN(); rebuildPins(); update(); }
});

document.querySelectorAll('input[name=twist]').forEach(r => r.addEventListener('change', () => { state.twist = r.value === '1'; update(); }));
function update(){
  document.querySelectorAll('input[name=twist]').forEach(r => r.checked = (r.value === '1') === !!state.twist);
  const t0 = TYPES[state.type], n0 = state.n;
  fixVariant('A'); fixVariant('B');
  typeSel.value = state.type;
  const t = TYPES[state.type]; nIn.value = state.n; nIn.min = t.min; nIn.max = t.max;
  syncSide('A'); syncSide('B');
  const res = analyse(); verdict(res); drawPinmap(res);
  if(!viewMode) save();
  try{
    if(onArtifact()) history.replaceState(null, '', '#' + encodeCable());
    else history.replaceState(null, '', location.pathname + '?' + queryString());
  }catch(e){}
}

// a BOM link (#c1.…) wins over what this browser remembered
const fromLink = fromUrl();
if(fromLink){ state = fromLink; viewMode = true; document.body.classList.add('view'); }
document.getElementById('editBtn').addEventListener('click', () => {
  viewMode = false; document.body.classList.remove('view'); update();
});
buildSide('A'); buildSide('B');
clampN(); rebuildPins(); update();
